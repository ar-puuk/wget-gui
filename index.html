<style>
/* Conduit design system. Shared by Mirror (robocopy-gui) and Fetch (wget-gui). Keep tokens and components identical in both. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;

  --bg:#E8ECEA; --surface:#FAFBFA; --sunken:#F0F3F1; --raised:#FFFFFF;
  --line:#D4DAD7; --line-2:#B9C3BE;
  --ink:#0E1917; --ink-2:#44514D; --ink-3:#66736F;
  --mirror:#0A7660; --fetch:#BA4F0A; --on-accent:#FFFFFF;
  --danger:#B3261E; --warn:#7F5300; --ok:#1B7339;
  --term:#0D1513; --term-line:#24332E; --term-ink:#D8E5E0; --term-dim:#849791;
  --syn-bin:#6EE7C8; --syn-path:#F2C879; --syn-flag:#8CC4FF; --syn-val:#D2C2FA;
  --shadow-1:0 1px 2px rgba(14,25,23,.06),0 1px 1px rgba(14,25,23,.04);
  --shadow-2:0 12px 32px rgba(14,25,23,.16),0 2px 6px rgba(14,25,23,.08);

  --r-s:6px; --r-m:10px; --r-l:16px;
  --gut:16px; --rail:248px;
  --accent:var(--mirror);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090F0E; --surface:#111917; --sunken:#0D1412; --raised:#17211E;
  --line:#223029; --line-2:#33463E;
  --ink:#E7F0ED; --ink-2:#A5B4AF; --ink-3:#7F8F8A;
  --mirror:#34C7A5; --fetch:#F0884A; --on-accent:#04120E;
  --danger:#FF8076; --warn:#E8B04A; --ok:#5BD08A;
  --term:#060B0A; --term-line:#1D2B27;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090F0E; --surface:#111917; --sunken:#0D1412; --raised:#17211E;
  --line:#223029; --line-2:#33463E;
  --ink:#E7F0ED; --ink-2:#A5B4AF; --ink-3:#7F8F8A;
  --mirror:#34C7A5; --fetch:#F0884A; --on-accent:#04120E;
  --danger:#FF8076; --warn:#E8B04A; --ok:#5BD08A;
  --term:#060B0A; --term-line:#1D2B27;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark}
[data-module="mirror"]{--accent:var(--mirror)}
[data-module="fetch"]{--accent:var(--fetch)}
@media (min-width:900px){:root{--gut:32px}}

*{box-sizing:border-box}
html,body{overflow-x:clip}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;overflow-wrap:break-word;min-width:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
code,.mono{font-family:var(--font-mono)}
small{font-size:13px;color:var(--ink-3)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;transition:none}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:20px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand-mark .ic{width:20px;height:20px;stroke-width:2.2}
.brand b{font:600 20px/1 var(--font-display);letter-spacing:-.02em}
.rail-group{display:flex;flex-direction:column;gap:2px}
.rail-group>span{font-size:13px;color:var(--ink-3);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-m);text-decoration:none;color:var(--ink-2);font-weight:500;transition:background-color .15s,color .15s}
.nav:hover{background:var(--sunken);color:var(--ink)}
.nav[aria-current="page"]{background:var(--sunken);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .tile{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--on-accent)}
.nav .tile .ic{width:16px;height:16px;stroke-width:2.2}
.tile.m{background:var(--mirror)} .tile.f{background:var(--fetch)}
.nav .count{margin-left:auto;font:500 12px var(--font-mono);background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 8px;min-width:22px;text-align:center}
.nav .count[hidden]{display:none}
.rail-foot{margin-top:auto;padding:12px;border-radius:var(--r-m);background:var(--sunken);font-size:13px;color:var(--ink-2);display:flex;gap:10px}
.rail-foot .ic{color:var(--accent);margin-top:2px}

.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;height:60px;padding-inline:max(var(--gut),env(safe-area-inset-left,0px)) max(var(--gut),env(safe-area-inset-right,0px))}
.crumb{font-size:14px;color:var(--ink-3);display:flex;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;width:min(340px,100%);height:38px;padding:0 10px 0 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer;transition:border-color .15s}
.search:hover{border-color:var(--line-2)}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 12px var(--font-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--sunken);color:var(--ink-2)}
.wrap{max-width:1280px;margin:0 auto;padding:28px max(var(--gut),env(safe-area-inset-right,0px)) 72px max(var(--gut),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s,opacity .15s}
.btn:hover{background:var(--sunken);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink));border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.icon{width:38px;padding:0}
.btn.danger-t:hover{color:var(--danger)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.sm.icon{width:32px;padding:0}

/* module header */
.mhead{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:24px;border:1px solid var(--line);border-radius:var(--r-l);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,var(--surface)),var(--surface) 62%)}
.mhead .tile{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow-1)}
.mhead .tile .ic{width:32px;height:32px;stroke-width:2}
.mhead .txt{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:4px}
.mhead h1{font-size:34px;line-height:1.1}
.mhead p{color:var(--ink-2);max-width:56ch}
.mhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.starts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.starts>span{font-size:14px;color:var(--ink-3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .ic{width:15px;height:15px}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;align-items:start}
.forms{display:flex;flex-direction:column;gap:16px;min-width:0}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-t{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.prog-t small{font-weight:500;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left center;transform:scaleX(0);transition:transform .3s}
.stepnav{display:flex;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.tabs button{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font-weight:600;font-size:14.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer;border-radius:var(--r-s) var(--r-s) 0 0;transition:color .15s,background-color .15s,border-color .15s}
.tabs button:hover{color:var(--ink);background:var(--sunken)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tc{font:500 12px/18px var(--font-mono);min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:var(--sunken);border:1px solid var(--line);color:var(--ink-2)}
.tc:empty{display:none}
.tabs button[aria-selected="true"] .tc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sec{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-1)}
.sec-h{padding:18px 20px 14px;display:flex;flex-direction:column;gap:2px}
.sec-h h3{font-size:19px}
.sec-h p{color:var(--ink-3);font-size:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:13px 20px;border-top:1px solid var(--line);transition:opacity .15s}
.row.in{grid-template-columns:minmax(0,1fr) minmax(0,250px)}
.row.path{grid-template-columns:minmax(0,1fr)}
.row.is-off{opacity:.5}
.lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl label{font-weight:600;cursor:pointer}
.lbl .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag{font-size:12px;background:var(--sunken);border:1px solid var(--line);color:var(--ink-2);border-radius:5px;padding:0 6px;line-height:20px}
.lbl small{overflow-wrap:anywhere}
.ctl{display:flex;align-items:center;gap:12px}
.inp{position:relative;display:flex;align-items:center}
.inp .ic{position:absolute;left:12px;color:var(--ink-3);pointer-events:none}
input[type=text],select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--raised);padding:0 12px;transition:border-color .15s,box-shadow .15s}
.inp .ic+input{padding-left:38px}
input[type=text]:hover,select:hover{border-color:var(--ink-3)}
input[type=text]:focus-visible,select:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=text]::placeholder{color:var(--ink-3);opacity:.8}
input:disabled,select:disabled{cursor:not-allowed}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background-color .18s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:var(--shadow-1);transition:transform .18s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px;transition:none}
.switch input:disabled{cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));grid-auto-rows:1fr;align-items:stretch;gap:10px;padding:2px 20px 18px;border-top:0}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode{position:relative;display:flex;min-width:0}
.mode label{display:flex;flex-direction:column;gap:4px;flex:1;min-height:132px;padding:14px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--raised);cursor:pointer;transition:border-color .15s,box-shadow .15s,background-color .15s}
.mode label b{font-family:var(--font-display);font-size:17px;font-weight:600}
.mode label span{font-size:13px;color:var(--ink-2)}
.mode label em{font-style:normal;font-size:13px;font-weight:600;margin-top:auto;padding-top:6px}
.mode label em.risk-danger{color:var(--danger)} .mode label em.risk-caution{color:var(--warn)}
.mode label:hover{border-color:var(--ink-3)}
.mode input:checked+label{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--raised));box-shadow:0 0 0 1px var(--accent)}
.mode input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px;transition:none}
.swap{display:flex;justify-content:center;margin:-8px 0}
.row.head{display:block;padding:16px 20px 8px;background:var(--sunken)}
.row.head h4{margin:0;font:600 14px var(--font-body);color:var(--ink-2)}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{position:relative;display:inline-flex}
.chks input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chks span{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--raised);font-size:13px;font-weight:500;color:var(--ink-2);transition:background-color .15s,border-color .15s,color .15s}
.chks input:hover+span{border-color:var(--ink-3)}
.chks input:checked+span{background:color-mix(in srgb,var(--accent) 14%,var(--raised));border-color:var(--accent);color:var(--ink)}
.chks input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px;transition:none}
.row textarea{min-height:84px;background:var(--raised)}
.finder{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.finder .inp{flex:1 1 280px}
.finder .fmt{margin-left:0;color:var(--ink-2)}
.finder-n{font-size:13px;color:var(--ink-3)}

/* command panel */
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 92px);overflow:auto;padding:2px}
.term{background:var(--term);color:var(--term-ink);border:1px solid var(--term-line);border-radius:var(--r-l);box-shadow:var(--shadow-2);overflow:hidden}
.term-h{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--term-line)}
.term-h h2{font-size:16px;color:var(--term-ink)}
.term-h small{color:var(--term-dim);margin-left:auto;font-variant-numeric:tabular-nums}
.term pre{margin:0;padding:18px;font:400 13.5px/1.75 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:120px;max-height:300px;overflow:auto}
.t-bin{color:var(--syn-bin);font-weight:500} .t-path{color:var(--syn-path)} .t-flag{color:var(--syn-flag)} .t-val{color:var(--syn-val)} .t-dim{color:var(--term-dim)}
.term-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--term-line);flex-wrap:wrap}
.term-f .btn.sec{background:transparent;color:var(--term-ink);border-color:var(--term-line)}
.term-f .btn.sec:hover{background:var(--term-line)}
.term-f .grow{flex:1 1 150px}
.fmt{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--term-dim)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:16px}
.badge{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid}
.badge .ic{width:15px;height:15px}
.badge.safe{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.badge.caution{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.badge.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.badge.info{color:var(--ink-2);border-color:var(--line-2);background:var(--sunken)}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.explain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.explain li{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.explain li:first-child{border-top:0;padding-top:0}
.explain code{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.empty{font-size:14px;color:var(--ink-3)}

/* queue and lists */
.two{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;align-items:start}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-1)}
.item{display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .n{font:500 13px var(--font-mono);color:var(--ink-3);width:22px;text-align:right}
.item .tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--on-accent)}
.item .tile .ic{width:18px;height:18px;stroke-width:2.1}
.item h3{font:600 15px var(--font-body);letter-spacing:0}
.item code{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{display:flex;gap:2px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-m);background:var(--sunken);border:1px solid var(--line)}
.seg button{height:30px;padding:0 14px;border:0;border-radius:7px;background:transparent;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow-1)}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h>div{flex:1 1 300px;display:flex;flex-direction:column;gap:4px}
.page-h h1{font-size:34px;line-height:1.1}
.page-h p{color:var(--ink-2);max-width:60ch}
.blank{padding:44px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--shadow-1)}
.pcard header{display:flex;align-items:center;gap:12px}
.pcard .tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--on-accent);flex:none}
.pcard h3{font:600 16px var(--font-body);letter-spacing:0}
.pcard p{font-size:14px;color:var(--ink-2)}
.pcard code{font-size:12.5px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard footer{display:flex;gap:8px;margin-top:auto}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-start;justify-content:center;padding:max(8vh,16px) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s}
.overlay[hidden]{display:none}
.modal{width:min(560px,100%);display:flex;flex-direction:column;max-height:100%;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:var(--shadow-2);overflow:hidden;animation:rise .18s}
.modal-h{padding:18px 20px 4px}
.modal-h h2{font-size:22px}
.modal-h p{color:var(--ink-2);font-size:14px;margin-top:2px}
.modal-b{padding:14px 20px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.modal-h,.modal-f,.pal .field,.pal-f{flex:none}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
textarea{width:100%;min-height:130px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--sunken);padding:12px;font:400 13px/1.6 var(--font-mono);resize:vertical}
textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pal .field{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-bottom:1px solid var(--line)}
.pal input{border:0;background:transparent;height:100%;padding:0;font-size:16px;box-shadow:none}
.pal input:focus-visible{box-shadow:none}
.pal ul{list-style:none;margin:0;padding:8px;flex:1 1 auto;min-height:0;overflow:auto}
.pal li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;color:var(--ink-2)}
.pal li b{font-weight:600;color:var(--ink)}
.pal li small{margin-left:auto}
.pal li[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 13%,var(--raised))}
.pal-f{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r-m);font-weight:500;box-shadow:var(--shadow-2);animation:rise .2s}
.toast .ic{color:var(--syn-bin)}
.toast.bad .ic{color:var(--danger)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* design system page */
.ds{display:flex;flex-direction:column;gap:20px}
.ds .sec-b{padding:6px 20px 20px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.sw{display:flex;flex-direction:column;gap:6px;font-size:13px}
.sw i{display:block;height:54px;border-radius:var(--r-m);border:1px solid var(--line)}
.sw b{font-weight:600;font-size:14px}
.sw code{color:var(--ink-3);font-size:12px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h3{font:600 15px var(--font-body);letter-spacing:0;color:var(--ink-2)}
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.specimen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.type-row{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.type-row:first-child{border-top:0}
.shapes{display:flex;gap:16px;flex-wrap:wrap}
.shape{width:104px;height:72px;background:var(--sunken);border:1px solid var(--line-2);display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--ink-2)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.pair .term pre{min-height:0}
.pair .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pair .head .tile{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}

@media (max-width:1100px){
  .builder,.two{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;overflow:visible}
}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .rail-group{flex-direction:row;gap:4px}
  .rail-group>span,.rail-foot,.brand b{display:none}
  .nav{white-space:nowrap}
  .nav .tile{display:none}
  .topbar{position:static}
  .crumb{display:none}
  .search{margin-left:0;width:100%}
}
@media (max-width:640px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .row.in{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:34px minmax(0,1fr)}
  .item .n{display:none}
  .item .a{grid-column:1/-1;justify-content:flex-end}
  .mhead h1,.page-h h1{font-size:28px}
  .explain li{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ------------------------------------------------------------------ engine */
const fieldsOf=m=>m.sections.flatMap(s=>s.fields);
function blank(m){const v={};fieldsOf(m).forEach(f=>{if(f.t==='head')return;v[f.id]=f.t==='toggle'?false:(f.t==='seg'||f.t==='sel')?f.options[0].v:f.t==='chk'?(f.dflt||''):''});return v}
function emit(m,v){
  const items=[];
  for(const f of fieldsOf(m)){
    if(f.t==='head'||(f.off&&f.off(v)))continue;
    const val=v[f.id],base={desc:f.help,risk:f.risk,note:f.note};
    if(f.t==='toggle'){if(val)items.push({...base,tok:[{t:'flag',v:f.flag}]});}
    else if(f.t==='seg'||f.t==='sel'){const o=f.options.find(o=>o.v===val);if(o&&o.flag)items.push({desc:o.desc,risk:o.risk,note:o.note,tok:o.flag.split(' ').map(x=>({t:'flag',v:x}))});}
    else if(f.t==='chk'){const s=String(val||'');if(s&&s!==(f.dflt||''))items.push({...base,tok:[{t:'flag',v:f.flag+':'},{t:'val',v:s,glue:1}]});}
    else if(f.t==='area'){String(val||'').split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>items.push({...base,tok:[{t:'flag',v:f.flag+'='},{t:'val',v:q(line),glue:1}]}));}
    else{
      const s=String(val||'').trim();
      if(!s||f.style==='pos'||(f.t==='path'&&!f.flag))continue;
      let tok;
      if(f.style==='colon')tok=[{t:'flag',v:f.flag+':'},{t:'val',v:q(s),glue:1}];
      else if(f.style==='eq')tok=[{t:'flag',v:f.flag+'='},{t:'val',v:q(s),glue:1}];
      else if(f.style==='space')tok=[{t:'flag',v:f.flag},{t:'val',v:q(s)}];
      else if(f.style==='list')tok=[{t:'flag',v:f.flag},...s.split(/\s+/).map(x=>({t:'val',v:x}))];
      else tok=s.split(/\s+/).map(x=>({t:'flag',v:x}));
      items.push({...base,tok});
    }
  }
  return items;
}
const gstr=g=>g.map((t,i)=>(i&&!t.glue?' ':'')+t.v).join('');
const ghtml=g=>g.map((t,i)=>(i&&!t.glue?' ':'')+`<span class="t-${t.t}">${esc(t.v)}</span>`).join('');
function compute(key,multi){
  const m=MODULES[key],v=S[key],items=emit(m,v);
  const head=m.head(v),tail=m.tail(v);
  const groups=[head,...items.map(i=>i.tok)];if(tail.length)groups.push(tail);
  const text=groups.map(gstr).join(multi?' ^\n  ':' ');
  const html=groups.map(ghtml).join(multi?' <span class="t-dim">^</span>\n  ':' ');
  const miss=m.need(v);
  const notes=[];items.forEach(i=>{if(i.risk&&i.note)notes.push({risk:i.risk,text:i.note})});
  m.advice(v).forEach(a=>notes.push(a));
  const level=notes.some(n=>n.risk==='danger')?'danger':notes.some(n=>n.risk==='caution')?'caution':'safe';
  return {text,html,items,notes,level,miss,flat:groups.map(gstr).join(' ')};
}

/* parser: paste an existing command, fill the form */
function parseCmd(key,text){
  const m=MODULES[key],v=blank(m),pre=m.flagChar,norm=s=>m.ci?s.toUpperCase():s;
  const toks=[...text.replace(/\^\s*\r?\n/g,' ').matchAll(/(?:[^\s"]+|"[^"]*")+/g)].map(x=>x[0].replace(/"/g,''));
  if(toks[0]&&/^(robocopy|wget)(\.exe)?$/i.test(toks[0]))toks.shift();
  const look=new Map();
  fieldsOf(m).forEach(f=>{
    if(f.t==='head')return;
    if(f.t==='toggle'){[f.flag,...(f.alias||[])].forEach(x=>look.set(norm(x),{f}))}
    else if(f.t==='seg'||f.t==='sel'){f.options.forEach(o=>{if(o.flag&&!o.flag.includes(' '))look.set(norm(o.flag),{f,o})})}
    else if(f.flag&&f.style!=='pos'&&f.style!=='raw'){[f.flag,...(f.alias||[])].forEach(x=>look.set(norm(x),{f}))}
  });
  const setVal=(f,val)=>{
    if(f.t==='chk'){const u=val.toUpperCase();v[f.id]=f.options.map(o=>o.v).filter(l=>u.includes(l)).join('')}
    else if(f.style==='rep')v[f.id]=(v[f.id]?v[f.id]+'\n':'')+val;
    else v[f.id]=val;
  };
  const pos=[],extra=[];
  for(let i=0;i<toks.length;i++){
    const tk=toks[i];
    if(!tk.startsWith(pre)){pos.push(tk);continue}
    const h=look.get(norm(tk));
    if(h){
      if(h.f.t==='toggle')v[h.f.id]=true;
      else if(h.o)v[h.f.id]=h.o.v;
      else if(h.f.style==='list'){const l=[];while(i+1<toks.length&&!toks[i+1].startsWith(pre))l.push(toks[++i]);v[h.f.id]=l.join(' ')}
      else if(h.f.t==='chk'||(m.ci&&h.f.style==='colon')){/* bare flag, nothing to read */}
      else if(i+1<toks.length)setVal(h.f,toks[++i]);
      continue;
    }
    const mm=tk.match(/^([^:=]+)[:=](.*)$/);
    const h2=mm&&look.get(norm(mm[1]));
    if(h2&&h2.f&&!h2.o&&['text','path','chk','area'].includes(h2.f.t)){setVal(h2.f,mm[2]);continue}
    extra.push(tk);
  }
  if(key==='mirror'){v.src=pos[0]||'';v.dst=pos[1]||'';v.inc=pos.slice(2).join(' ')}
  else v.url=pos[pos.length-1]||'';
  v.extra=extra.join(' ');
  return {v,unknown:extra.length};
}

const S={};Object.keys(MODULES).forEach(k=>{S[k]={...blank(MODULES[k]),...MODULES[k].defaults}});
const TAB={};
function isSet(f,x){
  if(f.t==='head')return false;
  if(f.t==='toggle')return !!x;
  if(f.t==='chk')return String(x||'')!==(f.dflt||'');
  if(f.t==='seg'||f.t==='sel'){const o=f.options.find(o=>o.v===x);return !!(o&&o.flag)}
  return String(x==null?'':x).trim()!=='';
}
function paintSteps(){
  const f=$('#prog-f');if(!f)return;
  const m=MODULES[cur],ids=m.sections.map(s=>s.id),id=ids.includes(TAB[cur])?TAB[cur]:ids[0],i=ids.indexOf(id),N=ids.length;
  const v=S[cur],app=fieldsOf(m).filter(x=>x.t!=='head'&&!(x.off&&x.off(v))&&(!x.adv||showAdv||isSet(x,v[x.id])));
  const n=app.filter(x=>isSet(x,v[x.id])).length,T=app.length,miss=compute(cur,false).miss;

function script(kind){
  const L=[];
  if(!queue.length)return '';
  if(kind==='bat'){
    L.push('@echo off','REM Generated by Conduit','setlocal','');
    queue.forEach((it,i)=>{L.push(`REM Job ${i+1}: ${it.name}`,it.cmd);if(stopOnFail)L.push(`if errorlevel ${it.mod==='mirror'?8:1} goto :failed`);L.push('')});
    L.push('echo All jobs finished.','exit /b 0','');
    if(stopOnFail)L.push(':failed','echo A job failed. Stopping here.','exit /b 1');
  }else{
    L.push('# Generated by Conduit',"$ErrorActionPreference = 'Stop'",'');
    queue.forEach((it,i)=>{L.push(`# Job ${i+1}: ${it.name}`,it.cmd);if(stopOnFail)L.push(`if ($LASTEXITCODE -ge ${it.mod==='mirror'?8:1}) { throw 'Job ${i+1} failed' }`);L.push('')});
    L.push("Write-Host 'All jobs finished.'");
  }
  return L.join('\n').trim();
}

function runPal(i){const a=palItems[i];if(!a)return;closePal();a.run()}
$('#pal-in').addEventListener('input',()=>{palSel=0;palRender()});
$('#pal-list').addEventListener('click',e=>{const li=e.target.closest('[data-i]');if(li)runPal(+li.dataset.i)});
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')closePal()});
$('#pal-in').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palRender();$('[aria-selected="true"]',$('#pal-list'))?.scrollIntoView({block:'nearest'})}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);palRender();$('[aria-selected="true"]',$('#pal-list'))?.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();runPal(palSel)}
});
$('#open-pal').onclick=openPal;
function applyPreset(i){const m=MODULES[cur],p=m.presets[i],keep={};fieldsOf(m).filter(f=>f.keep).forEach(f=>keep[f.id]=S[cur][f.id]);loadValues(cur,{...blank(m),...keep,...p.set});toast(`Applied ${p.name}`)}

/* ------------------------------------------------------------------ theme + router */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){$('#theme-ic').setAttribute('href',isDark()?'#i-sun':'#i-moon')}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('conduit.theme',n)}catch(e){}paintTheme();}
$('#theme').onclick=toggleTheme;
try{const t=localStorage.getItem('conduit.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
paintTheme();

const PAGES=[APP,'queue','profiles'];
const TITLES={[APP]:MODULES[APP].name,queue:'Queue',profiles:'Profiles'};
function route(){
  const h=(location.hash||'#'+APP).slice(1);page=PAGES.includes(h)?h:APP;
  if(MODULES[page])cur=page;
  $('#app').dataset.module=cur;
  $$('.nav').forEach(a=>a.toggleAttribute('aria-current',a.dataset.r===page)||a.removeAttribute('aria-current'));
  $$('.nav').forEach(a=>{if(a.dataset.r===page)a.setAttribute('aria-current','page')});
  $('#crumb').innerHTML=`<span>Conduit</span><span>/</span><b>${TITLES[page]}</b>`;
  if(MODULES[page])renderBuilder(page);else if(page==='queue')renderQueue();else renderProfiles();
  window.scrollTo(0,0);updQ();
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',tabFade);
$('#view').addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('tabs'))tabFade()},true);

/* ------------------------------------------------------------------ events */
const view=$('#view');
function onField(e){
  const el=e.target.closest('[data-f]');if(!el||!MODULES[page])return;
  const f=fieldsOf(MODULES[page]).find(x=>x.id===el.dataset.f);if(!f)return;
  if(el.dataset.chk!==undefined)S[page][f.id]=$$('input:checked',el.closest('.chks')).map(x=>x.dataset.chk).join('');
  else S[page][f.id]=el.type==='checkbox'?el.checked:el.value;
  update();
}
view.addEventListener('input',e=>{if(e.target.id==='find'){applyFilter();return}onField(e)});
view.addEventListener('change',e=>{
  if(e.target.id==='find')return;
  if(e.target.id==='adv'){showAdv=e.target.checked;applyFilter();update();return}
  if(e.target.id==='multi'){multi=e.target.checked;update();return}
  if(e.target.id==='stop'){stopOnFail=e.target.checked;renderQueue();return}
  onField(e);
});
view.addEventListener('keydown',e=>{
  const t=e.target.closest('[role="tab"]');if(!t||!MODULES[page])return;
  const ids=MODULES[page].sections.map(s=>s.id),i=ids.indexOf(t.dataset.tab);
  let n=-1;
  if(e.key==='ArrowRight')n=(i+1)%ids.length;else if(e.key==='ArrowLeft')n=(i-1+ids.length)%ids.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=ids.length-1;
  if(n>=0){e.preventDefault();setTab(ids[n],true)}
});
view.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.tab){setTab(b.dataset.tab);return}
  if(b.dataset.step){
    const ids=MODULES[page].sections.map(s=>s.id),i=ids.indexOf(ids.includes(TAB[page])?TAB[page]:ids[0]),n=i+(+b.dataset.step);
    if(ids[n]){setTab(ids[n]);$('.tabs').scrollIntoView({block:'nearest'})}
    return;
  }
  const act=b.dataset.act;
  if(act==='copy')copyCommand();
  else if(act==='add')addToQueue();
  else if(act==='paste')pasteDialog();
  else if(act==='save')saveDialog();
  else if(act==='dry'){S[cur][MODULES[cur].dryId]=true;renderBuilder(cur);toast('Preview only is on')}
  if(b.dataset.preset!==undefined)applyPreset(+b.dataset.preset);
  if(b.dataset.fmt){fmt=b.dataset.fmt;renderQueue()}
  const qa=b.dataset.q;
  if(qa){
    const row=b.closest('.item'),i=row?queue.findIndex(x=>x.id===+row.dataset.id):-1;
    if(qa==='up'&&i>0){[queue[i-1],queue[i]]=[queue[i],queue[i-1]];renderQueue()}
    else if(qa==='down'&&i>=0&&i<queue.length-1){[queue[i+1],queue[i]]=[queue[i],queue[i+1]];renderQueue()}
    else if(qa==='del'&&i>=0){queue.splice(i,1);updQ();renderQueue()}
    else if(qa==='edit'&&i>=0){S[queue[i].mod]={...queue[i].v};location.hash='#'+queue[i].mod;toast('Loaded into the builder')}
    else if(qa==='clear'){queue=[];updQ();renderQueue()}
    else if(qa==='download')downloadScript();
    else if(qa==='copyscript')copyText(script(fmt),'Script copied');
  }
  const pa=b.dataset.p;
  if(pa){
    const card=b.closest('.pcard'),p=card&&profiles.find(x=>x.id===card.dataset.id);
    if(pa==='load'&&p){S[p.mod]={...p.v};location.hash='#'+p.mod}
    else if(pa==='queue'&&p){const sv=S[p.mod];S[p.mod]=p.v;const c=compute(p.mod,false);S[p.mod]=sv;queue.push({id:uid++,mod:p.mod,name:MODULES[p.mod].summary(p.v),cmd:c.flat,v:{...p.v}});updQ();toast('Added to queue')}
    else if(pa==='del'&&p){profiles=profiles.filter(x=>x!==p);persistProfiles();renderProfiles()}
    else if(pa==='export')copyText(JSON.stringify(profiles.map(({name,mod,v})=>({name,mod,v})),null,2),'Profiles copied as JSON');
    else if(pa==='import')openModal('Import profiles','Paste JSON copied from Conduit.','<textarea id="imp" spellcheck="false" placeholder="[ { &quot;name&quot;: &quot;...&quot;, &quot;mod&quot;: &quot;mirror&quot;, &quot;v&quot;: { } } ]"></textarea>',[{label:'Cancel'},{label:'Import',primary:true,run:box=>{try{const a=JSON.parse($('#imp',box).value);if(!Array.isArray(a))throw 0;a.forEach(x=>{if(x&&MODULES[x.mod]&&x.v)profiles.push({id:'u'+uid++,name:String(x.name||'Imported'),mod:x.mod,v:{...blank(MODULES[x.mod]),...x.v},user:true})});persistProfiles();renderProfiles();toast('Profiles imported')}catch(err){toast('That is not valid profile JSON',true);return false}}}]);
  }
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?openPal():closePal();return}
  if(e.key==='Escape'){if(!$('#pal').hidden)closePal();else if(!$('#modal').hidden)closeModal();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&MODULES[page]){e.preventDefault();addToQueue()}
});
route();
})();
</script>
</body>
</html>
